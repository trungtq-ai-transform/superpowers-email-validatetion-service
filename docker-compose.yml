services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  app:
    build: .
    ports: ["8000:8000"]
    environment:
      EV_REDIS_URL: redis://redis:6379/0
      # sha256("dev-key") — local development only
      EV_API_KEY_HASHES: 7e9f8fd111802be56c379d597842e29b2cebd35ff2133d431a49fa556a18704e
      EV_LOG_LEVEL: INFO
    depends_on: [redis]
